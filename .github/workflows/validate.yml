name: Validate skill catalog
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/validate_links.py
      - run: python scripts/validate_installers.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_evals.py
